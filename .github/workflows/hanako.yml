name: Hanako build

# CI and releases in one pipeline:
#   * branch push    -> signed arm64 APK kept as a workflow artifact (14 days).
#                       Skipped when the commit already carries a release tag,
#                       because the tag's own run builds and publishes it.
#                       Docs-only pushes don't build at all.
#   * tag vX.Y.Z     -> validated (semver + CHANGELOG section) before the
#                       25-minute build, then published as a GitHub Release
#                       with the APK, its SHA-256 and the CHANGELOG notes.
#   * manual run     -> always builds.
# See RELEASING.md for the release checklist.

on:
  push:
    branches: [plus, hanako]
    tags: ['v*']
    # path filters only apply to branch pushes; tag pushes always run
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/assets/**'
  workflow_dispatch:

concurrency:
  group: hanako-${{ github.ref }}
  # never cancel a release build half way
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Decide whether to build
        id: decide
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Tag '${TAG}' is not a release tag (expected vMAJOR.MINOR.PATCH[-pre])."
              exit 1
            fi
            VER="${TAG#v}"
            if ! grep -qF "## [${VER}]" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::No '## [${VER}]' section. Add release notes before tagging."
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Release **${TAG}**: tag and changelog OK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Branch push: if a release tag points at this commit, its run owns the build.
          # ls-remote lists annotated tags twice; the peeled "^{}" line carries the commit.
          # Authenticated, so it also works if the repository is private; fail with a clear message.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          if ! REFS=$(git -c http.extraHeader="${AUTH}" ls-remote --tags "${REPO_URL}" 'refs/tags/v*'); then
            echo "::error::Could not list the release tags of ${REPO_URL}."
            exit 1
          fi
          TAGS=$(printf '%s\n' "${REFS}" \
            | awk -v sha="${GITHUB_SHA}" '$1 == sha { sub("refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' \
            | sort -u | paste -sd, -)
          if [ -n "${TAGS}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping branch build: ${GITHUB_SHA::7} is tagged ${TAGS}; the tag run builds and publishes it."
            echo "Skipped: \`${GITHUB_SHA::7}\` is tagged **${TAGS}**, whose run builds and publishes the APK." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build APK
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      apk_name: ${{ steps.out.outputs.apk_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply personal patches (legacy plus/patches, if any)
        run: |
          set -euo pipefail
          git config user.email ci@local; git config user.name ci
          shopt -s nullglob
          for p in plus/patches/*.patch; do
            echo "Applying $p"
            git apply --3way --whitespace=nowarn "$p"
          done

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Version and signing key
        id: prep
        env:
          # only "is it set?" is checked here; the key itself is used by the signing step alone
          HAS_KEY: ${{ secrets.HANAKO_KEYSTORE_B64 != '' }}
          # refs whose builds may carry the private key (A-17): tags plus these branches.
          # Any other branch (a manual run included) gets the public debug key.
          SIGN_REFS: 'refs/heads/hanako refs/heads/plus refs/heads/feature/backup'
        run: |
          set -euo pipefail
          APP_VN=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          # MG_BUILD_TAG must stay numeric X.Y.Z.M.K (gradle/mg-version.gradle);
          # M=90 marks Hanako builds, K = run number.
          BUILD_TAG="${APP_VN}.90.${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            LABEL="${GITHUB_REF_NAME}"
          else
            LABEL="${BUILD_TAG}"
          fi
          echo "tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          # Release signing uses Hanako's private key from repository secrets
          # (HANAKO_KEYSTORE_B64 / HANAKO_KEYSTORE_PASSWORD / HANAKO_KEY_ALIAS /
          # HANAKO_KEY_PASSWORD). The in-repo TMessagesProj/config/release.keystore
          # is Telegram's PUBLIC key: it is only a DEBUG FALLBACK for forks and
          # PRs without the secrets, and such APKs are labelled "-UNOFFICIAL".
          # Tag (release) runs refuse to fall back.
          #
          # Gradle always builds with the public debug key, so no Gradle task, plugin or
          # submodule script ever sees the private key or its passwords. The private key is
          # applied afterwards by apksigner in its own step (key in $RUNNER_TEMP, deleted after).
          echo "ks=$(base64 -w0 TMessagesProj/config/release.keystore)" >> "$GITHUB_OUTPUT"
          ALLOWED=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then ALLOWED=true; fi
          for r in ${SIGN_REFS}; do [ "${GITHUB_REF}" = "$r" ] && ALLOWED=true; done
          if [ "${HAS_KEY}" = "true" ] && [ "${ALLOWED}" = "true" ]; then
            echo "private=true" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "Signed with the **private Hanako release key**." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::HANAKO_KEYSTORE_B64 secret missing; refusing to publish a release signed with the public debug key."
              exit 1
            fi
            echo "private=false" >> "$GITHUB_OUTPUT"
            echo "suffix=-UNOFFICIAL-debugkey" >> "$GITHUB_OUTPUT"
            echo "::warning::APK signed with the PUBLIC in-repo debug key (no secrets, or ${GITHUB_REF} may not use the private key). Do not distribute it."
            echo "⚠️ Signed with the public in-repo **debug fallback** key (no secrets, or this ref may not use the private key). Not for distribution." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build APK
        id: build
        uses: ./.github/actions/build-mg
        with:
          flavor: afatFdArm64
          task: assembleAfatFdArm64Release
          abi: arm64-v8a
          build-type: release
          artifact-version: ${{ steps.prep.outputs.tag }}
          name-infix: '-plus'
          build-tag: ${{ steps.prep.outputs.tag }}
          # Telegram's official public Android keys (DrKLO BuildVars.java)
          app-id: '4'
          app-hash: '014b35b6184100b085b0d0572f9b5103'
          # always the public debug key; the private key is applied by the next step
          release-keystore-b64: ${{ steps.prep.outputs.ks }}
          release-keystore-password: 'android'
          release-key-alias: 'androidkey'
          release-key-password: 'android'

      - name: Sign with the Hanako release key
        if: steps.prep.outputs.private == 'true'
        env:
          HANAKO_KEYSTORE_B64: ${{ secrets.HANAKO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.HANAKO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HANAKO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.HANAKO_KEY_PASSWORD }}
          APK: ${{ steps.build.outputs.apk_path }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -1)
          KS="${RUNNER_TEMP}/hanako-release.jks"
          ( umask 077; printf '%s' "${HANAKO_KEYSTORE_B64}" | base64 -d > "${KS}" )
          # replaces the debug signature (v1/v2/v3 as the APK's minSdk needs)
          "${APKSIGNER}" sign --ks "${KS}" --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "${APK}.signed" "${APK}"
          rm -f "${KS}"
          "${APKSIGNER}" verify "${APK}.signed"
          mv "${APK}.signed" "${APK}"

      - name: Remove signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/hanako-release.jks"

      - name: Name APK
        id: out
        env:
          EXPECTED_CERT: ${{ vars.HANAKO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          NAME="Hanako-${{ steps.prep.outputs.label }}-arm64-v8a${{ steps.prep.outputs.suffix }}.apk"
          mkdir -p dist
          cp "${{ steps.build.outputs.apk_path }}" "dist/${NAME}"
          (cd dist && sha256sum "${NAME}" > "${NAME}.sha256")
          # record the signing certificate so the summary shows which key was used
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${APKSIGNER}" ]; then
            CERT=$("${APKSIGNER}" verify --print-certs "dist/${NAME}" | grep -m1 'SHA-256 digest' | awk '{print $NF}' || true)
            echo "Signing cert SHA-256: \`${CERT}\`" >> "$GITHUB_STEP_SUMMARY"
            # B-21: with the repository variable HANAKO_CERT_SHA256 set, a private build signed
            # with any other certificate fails (a misconfigured secret never ships).
            if [ "${{ steps.prep.outputs.private }}" = "true" ]; then
              if [ -n "${EXPECTED_CERT}" ]; then
                if [ "${CERT,,}" != "${EXPECTED_CERT,,}" ]; then
                  echo "::error::Signing certificate ${CERT} is not the expected Hanako certificate."
                  exit 1
                fi
              elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                echo "::warning::Set the repository variable HANAKO_CERT_SHA256 so releases check their signing certificate."
              fi
            fi
          fi
          echo "apk_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanako-arm64
          path: dist/
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: hanako-arm64
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # body of "## [VER] ..." up to the next "## [" heading or link refs
          awk -v ver="$VER" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::Section for ${VER} is empty."
            exit 1
          fi
          {
            echo
            echo "---"
            echo "**Install:** download \`${{ needs.build.outputs.apk_name }}\` (arm64-v8a) below."
            echo "Fully vibecoded fork: use at your own risk. Not affiliated with Telegram or upstream Mercurygram."
          } >> notes.md
          cat notes.md

      - name: Publish GitHub Release
        # pinned to a full commit SHA (v2 as of 2026-04-12): a moved tag can't run new code
        # with this job's contents: write token
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: 🌸 Hanako ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
