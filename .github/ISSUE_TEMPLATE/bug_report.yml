name: Bug report
description: Something in Hanako is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please report Hanako bugs **here**, not to Telegram or Forkgram.
        If the bug also happens in [Forkgram Classic](https://github.com/forkgram/forkgram-classic) or official Telegram, it belongs there instead.
  - type: input
    id: version
    attributes:
      label: Hanako version
      description: Release tag (e.g. v2.0d), or Settings → bottom of the screen ("Hanako for Android …")
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Android 15, Pixel 8
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ghost mode / read receipts / online status
        - Chat lock / hidden chats
        - Deleted & edited messages / deleted media
        - Activity log
        - Streamer mode
        - Message filters
        - Plugins
        - OpenPGP
        - Network (DoH, proxy, transfer boost)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on …
        2. Open …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Remove names, phone numbers and message content first.
